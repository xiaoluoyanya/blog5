<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人博客 | Blog — 无音desu</title>
    <link rel="preconnect" href="https://fonts.loli.net">
    <link href="https://fonts.loli.net/css2?family=DM+Serif+Display:ital@0;1&family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* ========== 设计令牌（与主页一致） ========== */
        :root {
            --font-serif: 'DM Serif Display', 'Noto Serif SC', Georgia, 'Songti SC', serif;
            --font-sans: 'Noto Sans SC', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            --font-mono: ui-monospace, 'Cascadia Code', Consolas, monospace;
            --bg: #ECE4D0;
            --bg-soft: #DDD3BE;
            --card: #F6F0E2;
            --ink: #2E2A22;
            --ink-soft: #5C564A;
            --ink-faint: #837C6C;
            --line: #C9BFA8;
            --accent: #7C7564;               /* 暖灰棕 */
            --accent-ink: #4A453C;           /* 暖深墨 */
            --accent-soft: rgba(74, 69, 60, 0.08);
            --shadow-card: 0 1px 2px rgba(22, 22, 26, 0.04), 0 12px 32px rgba(22, 22, 26, 0.06);
            --shadow-hover: 0 2px 4px rgba(22, 22, 26, 0.05), 0 24px 48px rgba(22, 22, 26, 0.10);
        }
        body[data-theme="dark"] {
            --bg: #312F36;
            --bg-soft: #3A3840;
            --card: #403E47;
            --ink: #EDECF0;
            --ink-soft: #B4B2BA;
            --ink-faint: #837F8A;
            --line: #4A4852;
            --accent: #5C7CFF;
            --accent-ink: #8FA4FF;
            --accent-soft: rgba(92, 124, 255, 0.12);
            --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 32px rgba(0, 0, 0, 0.35);
            --shadow-hover: 0 2px 4px rgba(0, 0, 0, 0.4), 0 24px 48px rgba(0, 0, 0, 0.5);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-sans);
            background: var(--bg); color: var(--ink);
            transition: background 0.4s ease, color 0.4s ease;
            min-height: 100vh; display: flex; flex-direction: column;
        }
        a { color: var(--accent-ink); }
        main { flex: 1; padding-top: 66px; }


        /* ========== 页面切换过渡 ========== */
        @keyframes pageIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: none; }
        }
        body.page-load { animation: pageIn 0.45s cubic-bezier(0.22, 1, 0.36, 1); }
        body.page-exit {
            opacity: 0; transform: translateY(-6px);
            transition: opacity 0.22s ease, transform 0.22s ease;
        }

        /* ========== 顶栏（与主页一致） ========== */
        .topbar {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
            background: color-mix(in srgb, var(--bg) 82%, transparent);
            backdrop-filter: blur(16px) saturate(150%);
            -webkit-backdrop-filter: blur(16px) saturate(150%);
            border-bottom: 1px solid var(--line);
            transition: background 0.4s ease;
        }
        .topbar-inner {
            max-width: 1080px; margin: 0 auto; padding: 0 28px;
            height: 66px;
            display: flex; align-items: center; justify-content: space-between; gap: 20px;
        }
        .brand {
            font-family: var(--font-serif); font-size: 1.25rem; letter-spacing: 0.5px;
            color: var(--ink); text-decoration: none; white-space: nowrap;
        }
        .brand em { font-style: normal; color: var(--accent-ink); }
        .nav-links { display: flex; gap: 28px; align-items: center; }
        .nav-links a {
            color: var(--ink-soft); text-decoration: none;
            font-size: 0.88rem; font-weight: 500; letter-spacing: 0.3px;
            position: relative; transition: color 0.2s ease;
        }
        .nav-links a::after {
            content: ''; position: absolute; left: 0; bottom: -4px;
            width: 100%; height: 1.5px; background: var(--accent);
            transform: scaleX(0); transform-origin: left; transition: transform 0.28s ease;
        }
        .nav-links a:hover { color: var(--ink); }
        .nav-links a:hover::after { transform: scaleX(1); }
        .nav-links a.active { color: var(--ink); }
        .nav-links a.active::after { transform: scaleX(1); }
        .nav-actions { display: flex; gap: 8px; }
        .icon-pill {
            height: 34px; padding: 0 14px;
            display: inline-flex; align-items: center; gap: 6px;
            border: 1px solid var(--line); border-radius: 999px;
            background: transparent; color: var(--ink-soft);
            font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 1px;
            cursor: pointer; transition: all 0.22s ease; white-space: nowrap;
        }
        .icon-pill:hover { border-color: var(--accent); color: var(--accent-ink); }

        /* ========== 页头 ========== */
        .blog-hero { max-width: 860px; margin: 0 auto; padding: 72px 28px 40px; }
        .blog-kicker {
            font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 3px;
            color: var(--accent-ink); text-transform: uppercase; margin-bottom: 12px;
        }
        .blog-title { font-family: var(--font-serif); font-weight: 400; font-size: 2.6rem; letter-spacing: 1px; }
        .blog-sub { color: var(--ink-faint); font-size: 0.95rem; margin-top: 10px; }
        .blog-count {
            font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 2px;
            color: var(--ink-faint); margin-top: 16px;
            display: inline-block; padding: 6px 14px;
            border: 1px solid var(--line); border-radius: 999px;
        }

        /* ========== 文章卡片 ========== */
        .article-list { max-width: 860px; margin: 0 auto; padding: 0 28px 80px; display: flex; flex-direction: column; gap: 22px; }
        .article-card {
            display: flex; gap: 22px; padding: 18px;
            background: var(--card); border: 1px solid var(--line); border-radius: 18px;
            box-shadow: var(--shadow-card);
            text-decoration: none; color: inherit;
            transition: transform 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease;
        }
        .article-card:hover {
            transform: translateY(-5px); box-shadow: var(--shadow-hover);
            border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
        }
        .article-num {
            font-family: var(--font-mono); font-size: 0.78rem; letter-spacing: 2px;
            color: var(--accent-ink); padding-top: 6px; flex-shrink: 0;
        }
        .article-cover {
            width: 200px; flex-shrink: 0; aspect-ratio: 4/3;
            border-radius: 12px; overflow: hidden; background: var(--bg-soft);
        }
        .article-cover img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1); }
        .article-card:hover .article-cover img { transform: scale(1.05); }
        .article-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
        .article-tag {
            font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 2px;
            color: var(--accent-ink); text-transform: uppercase; margin-bottom: 6px;
        }
        .article-meta {
            font-family: var(--font-mono); font-size: 0.64rem; letter-spacing: 1.6px;
            color: var(--ink-faint); margin-bottom: 8px;
        }
        .article-title { font-family: var(--font-serif); font-size: 1.25rem; font-weight: 500; letter-spacing: 0.3px; color: var(--ink); }
        .article-excerpt {
            color: var(--ink-faint); font-size: 0.86rem; line-height: 1.75; margin: 10px 0 14px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .article-foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
        .article-read {
            font-size: 0.82rem; color: var(--accent-ink); text-decoration: none;
            border-bottom: 1px solid var(--accent); padding-bottom: 2px;
        }
        .article-tags { font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 1px; color: var(--ink-faint); }

        /* ========== 空状态 & 页脚 ========== */
        .empty-tip { padding: 80px 0; text-align: center; color: var(--ink-faint); letter-spacing: 2px; }
        footer {
            border-top: 1px solid var(--line); padding: 28px; text-align: center;
            font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 1.5px;
            color: var(--ink-faint);
        }

        @media (max-width: 720px) {
            .article-card { flex-direction: column; }
            .article-cover { width: 100%; }
            .nav-links { gap: 16px; }
            .blog-title { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a href="index.html" class="brand">无音<em>desu</em></a>
            <nav class="nav-links">
                <a href="index.html">首页</a>
                <a href="blog.html" class="active">博客</a>
                <a href="gallery.html">相册</a>
            </nav>
            <div class="nav-actions">
                <button class="icon-pill" id="theme-btn" onclick="toggleTheme()">◐ THEME</button>
            </div>
        </div>
    </header>

    <main>
        <section class="blog-hero">
            <p class="blog-kicker">Blog · Life</p>
            <h1 class="blog-title">个人博客</h1>
            <p class="blog-sub">记录日常生活中的见闻与思考。</p>
            <span class="blog-count">共 <b id="entry-count">0</b> 篇文章</span>
        </section>
        <section id="article-list" class="article-list">
            <!-- JS 动态生成 -->
        </section>
    </main>

    <footer>© 2025 无音desu · Designed &amp; Built with ♥</footer>

    <script src="articles.js"></script>
    <script>
        // === 主题 ===
        const body = document.body;
        if (localStorage.getItem('site_theme') === 'dark') body.setAttribute('data-theme', 'dark');
        function toggleTheme() {
            if (body.getAttribute('data-theme') === 'dark') {
                body.removeAttribute('data-theme');
                localStorage.setItem('site_theme', 'light');
            } else {
                body.setAttribute('data-theme', 'dark');
                localStorage.setItem('site_theme', 'dark');
            }
        }

        // === 页面切换渐进过渡 ===
        body.classList.add('page-load');
        document.querySelectorAll('a').forEach(link => {
            const href = link.getAttribute('href') || '';
            if (!href.includes('.html')) return;
            link.addEventListener('click', function(e) {
                if (e.defaultPrevented || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
                e.preventDefault();
                body.classList.add('page-exit');
                setTimeout(() => { location.href = href; }, 230);
            });
        });

        // === 文章列表 ===
        document.getElementById('entry-count').innerText = articles.length;
        const list = document.getElementById('article-list');
        if (articles.length === 0) {
            list.innerHTML = '<p class="empty-tip">📭 暂无文章，敬请期待</p>';
        } else {
            articles.forEach((a, index) => {
                const card = document.createElement('a');
                card.className = 'article-card';
                card.href = 'article.html?id=' + a.id;
                card.innerHTML = `
                    <span class="article-num">${String(index + 1).padStart(2, '0')}</span>
                    <div class="article-cover"><img src="${a.cover}" alt="${a.title}" loading="lazy"></div>
                    <div class="article-body">
                        <p class="article-tag">${a.pdf ? 'Report' : 'Article'}</p>
                        <p class="article-meta">${a.date} · 无音desu</p>
                        <h2 class="article-title">${a.title}</h2>
                        <p class="article-excerpt">${a.excerpt}</p>
                        <div class="article-foot">
                            <span class="article-read">阅读全文 →</span>
                            <span class="article-tags">${(a.tags || []).map(t => '#' + t).join(' ')}</span>
                        </div>
                    </div>`;
                list.appendChild(card);
            });
        }
    </script>
</body>
</html>
