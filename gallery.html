<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>相册集 | Gallery — 无音desu</title>
    <link rel="preconnect" href="https://fonts.loli.net">
    <link href="https://fonts.loli.net/css2?family=DM+Serif+Display:ital@0;1&family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* ========== 设计令牌（与主页一致） ========== */
        :root {
            --font-serif: 'DM Serif Display', 'Noto Serif SC', Georgia, 'Songti SC', serif;
            --font-sans: 'Noto Sans SC', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            --font-mono: ui-monospace, 'Cascadia Code', Consolas, monospace;
            --bg: #ECE4D0;
            --bg-soft: #DDD3BE;
            --card: #F6F0E2;
            --ink: #2E2A22;
            --ink-soft: #5C564A;
            --ink-faint: #837C6C;
            --line: #C9BFA8;
            --accent: #7C7564;               /* 暖灰棕 */
            --accent-ink: #4A453C;           /* 暖深墨 */
            --accent-soft: rgba(74, 69, 60, 0.08);
            --shadow-card: 0 1px 2px rgba(22, 22, 26, 0.04), 0 12px 32px rgba(22, 22, 26, 0.06);
            --shadow-hover: 0 2px 4px rgba(22, 22, 26, 0.05), 0 24px 48px rgba(22, 22, 26, 0.10);
        }
        body[data-theme="dark"] {
            --bg: #312F36;
            --bg-soft: #3A3840;
            --card: #403E47;
            --ink: #EDECF0;
            --ink-soft: #B4B2BA;
            --ink-faint: #837F8A;
            --line: #4A4852;
            --accent: #5C7CFF;
            --accent-ink: #8FA4FF;
            --accent-soft: rgba(92, 124, 255, 0.12);
            --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 32px rgba(0, 0, 0, 0.35);
            --shadow-hover: 0 2px 4px rgba(0, 0, 0, 0.4), 0 24px 48px rgba(0, 0, 0, 0.5);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-sans);
            background: var(--bg); color: var(--ink);
            transition: background 0.4s ease, color 0.4s ease;
            min-height: 100vh; display: flex; flex-direction: column;
        }
        a { color: var(--accent-ink); }
        main { flex: 1; padding-top: 66px; }


        /* ========== 页面切换过渡 ========== */
        @keyframes pageIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: none; }
        }
        body.page-load { animation: pageIn 0.45s cubic-bezier(0.22, 1, 0.36, 1); }
        body.page-exit {
            opacity: 0; transform: translateY(-6px);
            transition: opacity 0.22s ease, transform 0.22s ease;
        }

        /* ========== 顶栏（与主页一致） ========== */
        .topbar {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
            background: color-mix(in srgb, var(--bg) 82%, transparent);
            backdrop-filter: blur(16px) saturate(150%);
            -webkit-backdrop-filter: blur(16px) saturate(150%);
            border-bottom: 1px solid var(--line);
            transition: background 0.4s ease;
        }
        .topbar-inner {
            max-width: 1080px; margin: 0 auto; padding: 0 28px;
            height: 66px;
            display: flex; align-items: center; justify-content: space-between; gap: 20px;
        }
        .brand {
            font-family: var(--font-serif); font-size: 1.25rem; letter-spacing: 0.5px;
            color: var(--ink); text-decoration: none; white-space: nowrap;
        }
        .brand em { font-style: normal; color: var(--accent-ink); }
        .nav-links { display: flex; gap: 28px; align-items: center; }
        .nav-links a {
            color: var(--ink-soft); text-decoration: none;
            font-size: 0.88rem; font-weight: 500; letter-spacing: 0.3px;
            position: relative; transition: color 0.2s ease;
        }
        .nav-links a::after {
            content: ''; position: absolute; left: 0; bottom: -4px;
            width: 100%; height: 1.5px; background: var(--accent);
            transform: scaleX(0); transform-origin: left; transition: transform 0.28s ease;
        }
        .nav-links a:hover { color: var(--ink); }
        .nav-links a:hover::after { transform: scaleX(1); }
        .nav-links a.active { color: var(--ink); }
        .nav-links a.active::after { transform: scaleX(1); }
        .nav-actions { display: flex; gap: 8px; }
        .icon-pill {
            height: 34px; padding: 0 14px;
            display: inline-flex; align-items: center; gap: 6px;
            border: 1px solid var(--line); border-radius: 999px;
            background: transparent; color: var(--ink-soft);
            font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 1px;
            cursor: pointer; transition: all 0.22s ease; white-space: nowrap;
        }
        .icon-pill:hover { border-color: var(--accent); color: var(--accent-ink); }

        /* ========== 页头 ========== */
        .gallery-hero { max-width: 1080px; margin: 0 auto; padding: 72px 28px 40px; }
        .gallery-kicker {
            font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 3px;
            color: var(--accent-ink); text-transform: uppercase; margin-bottom: 12px;
        }
        .gallery-title { font-family: var(--font-serif); font-weight: 400; font-size: 2.6rem; letter-spacing: 1px; }
        .gallery-sub { color: var(--ink-faint); font-size: 0.95rem; margin-top: 10px; }
        .gallery-count {
            font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 2px;
            color: var(--ink-faint); margin-top: 16px;
            display: inline-block; padding: 6px 14px;
            border: 1px solid var(--line); border-radius: 999px;
        }

        /* ========== 相册卡片网格 ========== */
        .album-grid {
            max-width: 1080px; margin: 0 auto; padding: 0 28px 80px;
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px;
        }
        .album-card {
            display: block; background: var(--card); border: 1px solid var(--line);
            border-radius: 16px; padding: 12px; text-decoration: none; color: inherit;
            box-shadow: var(--shadow-card);
            transition: transform 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease;
        }
        .album-card:hover {
            transform: translateY(-6px); box-shadow: var(--shadow-hover);
            border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
        }
        .album-cover { aspect-ratio: 4/3; border-radius: 12px; overflow: hidden; background: var(--bg-soft); }
        .album-cover img {
            width: 100%; height: 100%; object-fit: cover; display: block;
            transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .album-card:hover .album-cover img { transform: scale(1.05); }
        .album-name { margin-top: 14px; font-family: var(--font-serif); font-size: 1.05rem; font-weight: 500; letter-spacing: 0.3px; }
        .album-tag { font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 2px; color: var(--ink-faint); margin-top: 5px; }

        /* ========== 空状态 & 页脚 ========== */
        .empty-tip { padding: 80px 0; text-align: center; color: var(--ink-faint); letter-spacing: 2px; }
        footer {
            border-top: 1px solid var(--line); padding: 28px; text-align: center;
            font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 1.5px;
            color: var(--ink-faint);
        }

        @media (max-width: 860px) {
            .album-grid { grid-template-columns: 1fr 1fr; }
            .nav-links { gap: 16px; }
            .gallery-title { font-size: 2rem; }
        }
        @media (max-width: 540px) {
            .album-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a href="index.html" class="brand">无音<em>desu</em></a>
            <nav class="nav-links">
                <a href="index.html">首页</a>
                <a href="blog.html">博客</a>
                <a href="gallery.html" class="active">相册</a>
            </nav>
            <div class="nav-actions">
                <button class="icon-pill" id="theme-btn" onclick="toggleTheme()">◐ THEME</button>
            </div>
        </div>
    </header>

    <main>
        <section class="gallery-hero">
            <p class="gallery-kicker">Gallery</p>
            <h1 class="gallery-title">相册集</h1>
            <p class="gallery-sub">每一个相册，都是一段值得回放的回忆。</p>
            <span class="gallery-count">共 <b id="entry-count">0</b> 个相册</span>
        </section>
        <section id="album-grid" class="album-grid">
            <!-- JS 动态生成 -->
        </section>
    </main>

    <footer>© 2025 无音desu · Designed &amp; Built with ♥</footer>

    <script src="albums.js"></script>
    <script>
        // === 主题 ===
        const body = document.body;
        if (localStorage.getItem('site_theme') === 'dark') body.setAttribute('data-theme', 'dark');
        function toggleTheme() {
            if (body.getAttribute('data-theme') === 'dark') {
                body.removeAttribute('data-theme');
                localStorage.setItem('site_theme', 'light');
            } else {
                body.setAttribute('data-theme', 'dark');
                localStorage.setItem('site_theme', 'dark');
            }
        }

        // === 页面切换渐进过渡 ===
        body.classList.add('page-load');
        document.querySelectorAll('a').forEach(link => {
            const href = link.getAttribute('href') || '';
            if (!href.includes('.html')) return;
            link.addEventListener('click', function(e) {
                if (e.defaultPrevented || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
                e.preventDefault();
                body.classList.add('page-exit');
                setTimeout(() => { location.href = href; }, 230);
            });
        });

        // === 相册列表 ===
        document.getElementById('entry-count').innerText = albums.length;
        const grid = document.getElementById('album-grid');
        if (albums.length === 0) {
            grid.innerHTML = '<p class="empty-tip">📭 相册集暂无内容，敬请期待</p>';
        } else {
            albums.forEach((album, index) => {
                const card = document.createElement('a');
                card.className = 'album-card';
                card.href = 'album.html?id=' + index;
                card.innerHTML = `
                    <div class="album-cover"><img src="${album.cover}" alt="${album.title}" loading="lazy"></div>
                    <p class="album-name">${album.title}</p>
                    <p class="album-tag">${album.tag || 'Album'}</p>`;
                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>
